name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the OIDC token
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x

      # Everything that only reads from pub.dev runs before any credentials
      # exist. Once a token is registered for pub.dev, pub attaches it to every
      # request - plain dependency lookups included - and a token pub.dev
      # rejects makes those fail as `<package> doesn't exist (authorization
      # failed)`, which is what broke this workflow on v14.1.0.
      # `dart pub get`, not `flutter pub get`: the latter rewrites
      # analysis_options.yaml and regenerates the example's plugin registrants,
      # which leaves checked-in files modified and fails the dry run below.
      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      # Mints the OIDC token and registers it for pub.dev, so only the publish
      # below is authenticated.
      - name: Setup pub.dev credentials
        uses: dart-lang/setup-dart@v1

      # `flutter pub`, because the step above puts its own Dart SDK ahead of
      # Flutter's on PATH and that one cannot resolve `sdk: flutter`.
      - name: Publish to pub.dev
        run: flutter pub publish --force

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
